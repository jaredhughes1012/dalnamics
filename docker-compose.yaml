services:
  postgres:
    container_name: postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dalnamics
      POSTGRES_PASSWORD: dalnamics
      POSTGRES_DB: dalnamics
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: during first-run initdb the server accepts only socket
      # connections, so this stays unhealthy until the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U dalnamics -d dalnamics"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    container_name: api
    build:
      context: .
      dockerfile: services/api/cmd/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      API_ADDR: ":8080"
      DATABASE_URL: postgres://dalnamics:dalnamics@postgres:5432/dalnamics?sslmode=disable
      JWT_SECRET: local-dev-secret-not-for-production-use
      DEBUG: "true"
      DEV_EMAILS: dev@dalnamics.local,e2e@dalnamics.local
    ports:
      - "8080:8080"
      - "2345:2345" # delve
    cap_add: [SYS_PTRACE]
    security_opt: [seccomp:unconfined]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15

  devicemgr:
    container_name: devicemgr
    build:
      context: .
      dockerfile: services/devicemgr/cmd/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DEVICEMGR_ADDR: ":8081"
      DATABASE_URL: postgres://dalnamics:dalnamics@postgres:5432/dalnamics?sslmode=disable
      DEVICEMGR_TOKEN: local-devicemgr-token-not-for-production-use
      DEVICEMGR_MQTT_URL: mqtt://mosquitto:1883
      DEVICEMGR_MQTT_PASSWORD: local-devicemgr-mqtt-password-not-for-production
    ports:
      - "8081:8081"
      - "2346:2346" # delve
    cap_add: [SYS_PTRACE]
    security_opt: [seccomp:unconfined]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15

  # MQTT broker for devices. Authentication and ACLs are delegated to
  # devicemgr's /mqtt endpoints (services/devicemgr/mosquitto/mosquitto.conf).
  mosquitto:
    container_name: mosquitto
    image: iegomez/mosquitto-go-auth:3.0.0-mosquitto_2.0.18
    depends_on:
      devicemgr:
        condition: service_started
    volumes:
      - ./services/devicemgr/mosquitto/mosquitto.conf:/etc/mosquitto/mosquitto.conf:ro
    ports:
      - "1883:1883"

volumes:
  pgdata:
