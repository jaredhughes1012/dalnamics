[project]
name = "harwood0-api"
version = "0.1.0"
description = "Control API exposing harwood0 robot capabilities"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx2>=2.13",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
harwood0-api = "harwood0_api.__main__:main"
harwood0-check = "harwood0_api.check:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harwood0_api"]

[tool.ruff]
line-length = 100
