<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>harwood0 cameras</title>
<style>
  :root {
    --bg: #f4f4f2; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --border: #dcdcd6;
    --accent: #2f6fdb; --ok: #23864a; --bad: #c2412d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1f1f1d; --text: #ececea; --muted: #9a9a94; --border: #34342f;
      --accent: #6c9bff; --ok: #4cc27a; --bad: #ff7b66;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  h1 { font-size: 18px; margin: 0 auto 0 0; }
  nav { display: flex; gap: 4px; }
  nav button {
    font: inherit; padding: 6px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
  }
  nav button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .screen {
    position: relative; aspect-ratio: 4 / 3; background: #000; border-radius: 8px; overflow: hidden;
  }
  .screen img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .screen p {
    position: absolute; inset: 0; margin: 0; display: grid; place-items: center;
    padding: 16px; text-align: center; color: #bbb;
  }
  .screen p[hidden], .screen img.waiting { visibility: hidden; }
  .status {
    display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin-top: 10px;
    color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: var(--bad); }
  .dot.ok { background: var(--ok); }
  .status a { color: var(--accent); margin-left: auto; }
  .error { color: var(--bad); flex-basis: 100%; }
</style>
</head>
<body>
<main>
  <header>
    <h1>harwood0 cameras</h1>
    <nav id="tabs"></nav>
  </header>
  <div class="screen">
    <img id="video" alt="">
    <p id="message">Connecting…</p>
  </div>
  <div class="status">
    <span><span id="dot" class="dot"></span><span id="state">—</span></span>
    <span id="fps"></span>
    <span id="frames"></span>
    <a id="snapshot" target="_blank">Open frame</a>
    <span id="error" class="error"></span>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let current = null;

function show(name) {
  current = name;
  history.replaceState(null, "", "#" + name);
  for (const b of $("tabs").children) b.setAttribute("aria-pressed", b.dataset.name === name);
  $("snapshot").href = `/cameras/${name}/frame`;
  $("video").alt = `${name} camera`;
  waiting(true, "Connecting…");
  // A new URL each time, so the browser drops the old stream and never reuses a cached one.
  $("video").src = `/cameras/${name}/stream?t=${Date.now()}`;
}

// Show the message, and hide the image so a broken-image icon never shows, until a frame.
function waiting(on, text) {
  $("message").hidden = !on;
  if (text) $("message").textContent = text;
  $("video").classList.toggle("waiting", on);
}

$("video").addEventListener("load", () => waiting(false));
$("video").addEventListener("error", () => {
  waiting(true, "Stream lost; retrying…");
  setTimeout(() => current && show(current), 2000);
});

async function poll() {
  if (!current) return;
  try {
    const s = await (await fetch(`/cameras/${current}`)).json();
    $("dot").classList.toggle("ok", s.connected);
    $("state").textContent = s.connected ? "streaming" : "not connected";
    $("fps").textContent = s.connected ? `${s.fps.toFixed(1)} fps` : "";
    $("frames").textContent = `${s.frames} frames`;
    $("error").textContent = !s.connected && s.error ? `${s.url}: ${s.error}` : "";
    if (s.connected && s.frames) waiting(false);
  } catch {
    $("dot").classList.remove("ok");
    $("state").textContent = "API unreachable";
  }
}

async function start() {
  const cameras = await (await fetch("/cameras")).json();
  if (!cameras.length) {
    $("message").textContent = "No cameras configured. Set HARWOOD0_NOSE_CAMERA_URL.";
    return;
  }
  for (const c of cameras) {
    const b = document.createElement("button");
    b.textContent = c.name;
    b.dataset.name = c.name;
    b.onclick = () => show(c.name);
    $("tabs").append(b);
  }
  const wanted = location.hash.slice(1);
  show(cameras.some((c) => c.name === wanted) ? wanted : cameras[0].name);
  poll();
  setInterval(poll, 1000);
}

start();
</script>
</body>
</html>
