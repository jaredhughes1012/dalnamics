[project]
name = "harwood0-cad"
version = "0.1.0"
description = "Parametric CAD for the harwood0 robot body"
requires-python = ">=3.12,<3.14"
dependencies = [
    "build123d>=0.9",
]

[project.scripts]
harwood0-cad = "harwood0_cad.export:main"
harwood0-render = "harwood0_cad.render:main"
harwood0-show = "harwood0_cad.show:main"

[dependency-groups]
dev = [
    "ocp-vscode>=2.6",
    "pytest>=8",
    "pyvista>=0.49.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harwood0_cad"]

[tool.ruff]
line-length = 100
