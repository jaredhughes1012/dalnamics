; harwood0 camera firmware for the AI-Thinker ESP32-CAM. One env per camera; they differ only
; in name, which sets the hostname (harwood0-<name>.local).

[env]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

[env:nose]
build_flags =
    ${env.build_flags}
    -DCAMERA_NAME=\"nose\"

[env:arm]
build_flags =
    ${env.build_flags}
    -DCAMERA_NAME=\"arm\"
