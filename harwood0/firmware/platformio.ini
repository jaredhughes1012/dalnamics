; harwood0 firmware. `pio run` builds for the robot, `pio test -e native` runs host unit tests.

[platformio]
default_envs = uno_r4_wifi

[env]
lib_deps =
    bblanchon/ArduinoJson@^7.2
build_flags =
    -std=gnu++17
    -DHARWOOD0_FW_VERSION=\"0.1.0\"
build_unflags = -std=gnu++11

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200

[env:native]
platform = native
test_framework = unity
