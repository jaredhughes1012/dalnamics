; harwood0 firmware. `pio run` builds for the robot, `pio test -e native` runs host unit tests,
; and `pio run -e hello` builds the connectivity check (src/hello), which drives no hardware.

[platformio]
default_envs = uno_r4_wifi

[fw]
version = 0.2.0

[env]
lib_deps =
    bblanchon/ArduinoJson@^7.2
build_flags =
    -std=gnu++17
    -DHARWOOD0_FW_VERSION=\"${fw.version}\"
build_unflags = -std=gnu++11

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<hello/>
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit PWM Servo Driver Library@^3.0

[env:hello]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
build_src_filter = +<hello/>
build_flags =
    -std=gnu++17
    -DHARWOOD0_FW_VERSION=\"${fw.version}-hello\"

[env:native]
platform = native
test_framework = unity
