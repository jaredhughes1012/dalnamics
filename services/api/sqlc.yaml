version: "2"
sql:
  - engine: postgresql
    schema: internal/store/migrations
    queries: internal/store/queries/auth.sql
    gen:
      go:
        package: auth
        out: internal/store/auth
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: citext
            go_type: string
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
