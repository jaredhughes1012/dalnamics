# Mosquitto, the platform's MQTT broker, with authentication and topic ACLs
# delegated to devicemgr through mosquitto-go-auth's HTTP backend. Rules live in
# devicemgr; see docs/devices.md#broker-authorization.
listener 1883
protocol mqtt
allow_anonymous false
persistence false
log_dest stdout

auth_plugin /mosquitto/go-auth.so
auth_opt_log_level info
auth_opt_backends http
# Off, so a device whose credentials stop being valid is rejected on its next
# connect.
auth_opt_cache false

auth_opt_http_host devicemgr
auth_opt_http_port 8081
auth_opt_http_getuser_uri /mqtt/user
auth_opt_http_superuser_uri /mqtt/superuser
auth_opt_http_aclcheck_uri /mqtt/acl
auth_opt_http_params_mode json
auth_opt_http_response_mode status
auth_opt_http_timeout 5
