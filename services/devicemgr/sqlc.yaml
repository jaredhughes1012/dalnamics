version: "2"
sql:
  - engine: postgresql
    schema:
      - internal/store/migrations
      # public.device_registration_codes, which devicemgr reads to redeem a code.
      - ../api/internal/store/migrations
    queries: internal/store/queries/devices.sql
    gen:
      go:
        package: devices
        out: internal/store/devices
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: citext
            go_type: string
          - db_type: timestamptz
            go_type: time.Time
