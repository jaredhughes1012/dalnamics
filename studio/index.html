<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio</title>
    <script>
      // Applies the saved theme before first paint; src/stores/theme.ts takes over once loaded.
      // Mirrors that store's storage key, persisted shape, and resolveTheme; keep them in sync.
      try {
        const theme = JSON.parse(localStorage.getItem('dalnamics-theme') ?? '{}').state?.theme ?? 'system'
        const dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
